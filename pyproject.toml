[project]
name = "avtoklik"
version = "0.1.0"
description = "АвтоКлик — проверка, оценка и покупка автомобилей с пробегом"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    # Формы флоу продажи: FastAPI читает multipart только с ней.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["avtoklik*"]

# Шаблоны и статика — часть пакета, а не «ресурсы рядом». Без этого
# установленное колесо отдаёт 500 на первой же странице.
[tool.setuptools.package-data]
avtoklik = ["web/templates/*.html", "web/static/css/*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Документация — не исходный код: линтер не должен переписывать примеры в ней.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
