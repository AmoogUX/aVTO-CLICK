name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Линт
        run: ruff check .
      - name: Форматирование
        run: ruff format --check .
      - name: Типы
        run: mypy avtoklik
      - name: Тесты
        run: pytest -q
