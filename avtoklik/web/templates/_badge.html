{# Метка-смысл. Глиф помечен aria-hidden, потому что «↓» скринридер читает
   как «стрелка вниз» — шум. Смысл несёт слово рядом, и оно обязательно:
   §3.4 запрещает передавать статус одним лишь цветом. #}
<span class="badge {{ badge.tone }}">
  <span aria-hidden="true">{{ badge.glyph }}</span>{{ badge.text }}
</span>
